[project]
dependencies = [
  "addict>=2.4.0",
  "easydict>=1.13",
  "einops>=0.8.1",
  "fastmcp>=3.0.2",
  "jellyfish>=1.2.1",
  "jupyter>=1.1.1",
  "markdown-pdf>=1.10",
  "markdown2>=2.5.4",
  "matplotlib>=3.10.8",
  "ollama>=0.6.1",
  "openai>=2.15.0",
  "pdf2image>=1.17.0",
  "pdfminer>=20191125",
  "pdfminer-six>=20260107",
  "pymupdf>=1.27.1",
  "pypdf>=6.6.0",
  "reportlab>=4.4.9",
  "spire-presentation>=11.1.0",
  "sqlalchemy>=2.0.47",
  "streamlit>=1.53.0",
]
description = "Add your description here"
name = "pdf-engine"
readme = "README.md"
requires-python = ">=3.14"
version = "1.0.0"

[project.scripts]
pdfui = "package.launcher:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/package"]
